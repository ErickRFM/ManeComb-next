name: Refresh lockfile

on:
  push:
    branches:
      - audit/production-hardening-rc1

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/production-hardening-rc1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "manecomb-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh npm lockfile"
          git push origin HEAD:audit/production-hardening-rc1
