name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/manecomb_ci
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-auth-secret-abcdefghijklmnopqrstuvwxyz-0123456789
      MFA_ENCRYPTION_KEY: ci-mfa-secret-abcdefghijklmnopqrstuvwxyz-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - name: Smoke custom Node server
        run: |
          npx tsx server.ts > /tmp/manecomb-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health/live >/dev/null; then
              kill $SERVER_PID 2>/dev/null || true
              wait $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/manecomb-server.log
          exit 1
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
