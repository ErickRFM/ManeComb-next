name: Generate lockfile

on:
  push:
    branches:
      - audit/production-hardening-rc1

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/production-hardening-rc1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Check lockfile
        id: check
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate package-lock.json
        if: steps.check.outputs.missing == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        if: steps.check.outputs.missing == 'true'
        shell: bash
        run: |
          git config user.name "manecomb-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): add reproducible npm lockfile"
          git push origin HEAD:audit/production-hardening-rc1
