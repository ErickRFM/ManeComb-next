<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>ManeComb · Conexión</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#08090b;color:#f7f8fb}
    main{width:min(100%,420px);padding:26px;border:1px solid #272b35;border-radius:20px;background:#111318;box-shadow:0 24px 70px rgba(0,0,0,.34)}
    .mark{width:44px;height:44px;display:grid;place-items:center;margin-bottom:20px;border-radius:14px;background:#d80000;color:white;font-weight:900}
    h1{margin:0;font-size:25px;letter-spacing:-.04em}
    p{margin:12px 0 0;color:#a8afbd;line-height:1.55;font-size:14px}
    button{width:100%;min-height:48px;margin-top:22px;border:0;border-radius:12px;background:#d80000;color:#fff;font:inherit;font-weight:800;cursor:pointer}
    small{display:block;margin-top:14px;color:#747b86;font-size:11px;line-height:1.45}
  </style>
</head>
<body>
  <main>
    <div class="mark">MC</div>
    <h1>No se pudo abrir ManeComb</h1>
    <p>La app no pudo cargar su interfaz. Revisa tu conexión a internet y vuelve a intentarlo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <small>Si el problema continúa, actualiza Android System WebView y registra el diagnóstico del dispositivo.</small>
  </main>
</body>
</html>
