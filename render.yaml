services:
  - type: keyvalue
    name: manecomb-next-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: web
    name: manecomb-next
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    healthCheckPath: /api/health/ready
    preDeployCommand: npm run deploy:check
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: APP_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: manecomb-next-redis
          property: connectionString
      - key: REDIS_NAMESPACE
        value: manecomb-next-prod
      - key: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        value: mailto:soporte@manecomb.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RTC_STUN_URLS
        value: stun:stun.l.google.com:19302
      - key: RTC_TURN_URLS
        sync: false
      - key: RTC_TURN_USERNAME
        sync: false
      - key: RTC_TURN_CREDENTIAL
        sync: false
      - key: RTC_TURN_SECRET
        sync: false

  - type: worker
    name: manecomb-next-communication-worker
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    dockerCommand: npm run worker
    preDeployCommand: npm run deploy:check:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: manecomb-next-redis
          property: connectionString
      - key: REDIS_NAMESPACE
        value: manecomb-next-prod
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        value: mailto:soporte@manecomb.com
